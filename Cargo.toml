[package]
name = "badlang"
version = "0.5.0"
authors = ["The BadLang™ Developers <contact@badlang.dev>"]
rust-version = "1.78.0"
description = "Next generation stack-based programming language"
documentation = "https://docs.rs/badlang"
readme = "README.md"
repository = "https://github.com/gianzellweger/badlang"
license = "CC0-1.0"
keywords = ["language", "programming", "programming-language"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
ratatui = "0.27.0"
anyhow = "1.0.86"
argon2 = "0.5.3"
captcha = "0.0.9"
chrono = { version = "0.4.38", features = ["alloc"] }
clap = { version = "4.5.16", features = ["derive", "cargo"] }
colored = "2.1.0"
fastrand = "2.1.0"
geocoding = "0.4.0"
geolocation = "0.2.1"
google-authenticator = "0.4.2"
home = "0.5.9"
humansize = "2.1.3"
indicatif = "0.17.8"
inquire = "0.7.5"
itertools = "0.13.0"
jod-thread = "0.1.2"
local-ip-address = "0.6.1"
native-dialog = "0.7.0"
notify-rust = "4.11.1"
open = "5.1.4"
badlang-parser = { path = "badlang-parser", features = ["silly"], version = "0.1.0" }
percent-encoding = "2.3.1"
qrcode = "0.14.0"
rand = "0.8.5"
reqwest = { version = "0.12.5", features = ["json", "blocking"] }
savefile = "0.17.4"
savefile-derive = "0.17.7"
semver = "1.0.23"
serde_json = "1.0.127"
static_assertions = "1.1.0"
strum = "0.26.3"
strum_macros = "0.26.4"
tauri = { version = "1.6.8", features = ["window-all", "process-command-api"] }
tokio = "1.39.3"
unic-emoji-char = "0.9.0"
crokey = "1.0.1"
