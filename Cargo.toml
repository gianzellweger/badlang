[package]
name = "badlang"
version = "0.5.0"
authors = ["The BadLang™ Developers <contact@badlang.dev>"]
rust-version = "1.90.0"
description = "Next generation stack-based programming language"
documentation = "https://docs.rs/badlang"
readme = "README.md"
repository = "https://github.com/gianzellweger/badlang"
license = "CC0-1.0"
keywords = ["language", "programming", "programming-language"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ratatui = "0.29.0"
anyhow = "1.0.100"
argon2 = "0.5.3"
captcha = "1.0.0"
chrono = { version = "0.4.42", features = ["alloc"] }
clap = { version = "4.5.53", features = ["derive", "cargo"] }
colored = "3.0.0"
fastrand = "2.3.0"
geocoding = "0.4.0"
geolocation = "0.2.1"
google-authenticator = "0.4.2"
home = "0.5.12"
humansize = "2.1.3"
indicatif = "0.18.3"
inquire = "0.9.1"
itertools = "0.14.0"
jod-thread = "1.0.0"
local-ip-address = "0.6.5"
native-dialog = "0.9.4"
notify-rust = "4.11.7"
open = "5.3.3"
badlang-parser = { path = "badlang-parser", features = ["silly"], version = "0.1.0" }
percent-encoding = "2.3.2"
qrcode = "0.14.1"
rand = "0.9.2"
reqwest = { version = "0.12.28", features = ["json", "blocking"] }
savefile = "0.20.2"
savefile-derive = "0.20.2"
semver = "1.0.27"
serde_json = "1.0.145"
static_assertions = "1.1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = "1.48.0"
unic-emoji-char = "0.9.0"
crokey = "1.3.0"
robius-authentication = "0.1.1"
